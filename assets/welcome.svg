<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Welcome — I'm Lukas</title>
  <desc id="description">I build thoughtful tools for people and AI.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="0.55" stop-color="#172554" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="glow-a" cx="0.25" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.34" />
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-b" cx="0.85" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.3" />
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="360" rx="30" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="360" fill="url(#background)" />
    <rect width="1200" height="360" fill="url(#glow-a)" />
    <rect width="1200" height="360" fill="url(#glow-b)" />

    <g fill="none" stroke="#a5f3fc" stroke-opacity="0.18">
      <circle cx="1030" cy="65" r="165" />
      <circle cx="1030" cy="65" r="125" />
      <circle cx="1030" cy="65" r="85" />
    </g>

    <circle cx="118" cy="290" r="94" fill="#22d3ee" fill-opacity="0.15" filter="url(#blur)" />
    <circle cx="1100" cy="292" r="108" fill="#a78bfa" fill-opacity="0.18" filter="url(#blur)" />

    <g transform="translate(88 88)">
      <rect width="74" height="5" rx="2.5" fill="#67e8f9" />
      <text x="0" y="92" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="61" font-weight="700" letter-spacing="-1.8">Welcome — I'm Lukas</text>
      <text x="2" y="145" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="400" letter-spacing="0.2">I build thoughtful tools for people and AI.</text>
      <text x="2" y="196" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="500" letter-spacing="1.4">AI SYSTEMS  ·  HUMAN DEVELOPMENT  ·  CALM TECHNOLOGY</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="29" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />
</svg>
