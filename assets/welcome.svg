<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Hello, I'm Lukas.</title>
  <desc id="description">Making complex systems feel calm, fast, and beautiful.</desc>

  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#27272a" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <radialGradient id="orange-glow" cx="0.86" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#fa5c26" stop-opacity="0.016" />
      <stop offset="1" stop-color="#fa5c26" stop-opacity="0" />
    </radialGradient>
    <clipPath id="rounded">
      <rect width="1200" height="360" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="360" fill="#f4f4f5" />
    <rect width="1200" height="360" fill="url(#grid)" />
    <rect width="1200" height="360" fill="url(#orange-glow)" />

    <g transform="translate(72 93)">
      <text x="0" y="52" fill="#27272a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="62" font-weight="600" letter-spacing="-3">Hello, I'm Lukas.</text>
      <text x="2" y="105" fill="#52525b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21" font-weight="400">Making complex systems feel calm, fast, and beautiful.</text>
      <g transform="translate(2 157)">
        <circle cx="7" cy="7" r="7" fill="#fa5c26" />
        <text x="24" y="13" fill="#27272a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="500">lukashammarstrom.com  ↗</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#27272a" stroke-opacity="0.18" stroke-width="2" />
</svg>
